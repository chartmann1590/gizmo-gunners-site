name: Feature idea
description: Suggest a new robot, weapon, mode or anything else
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see in Gizmo Gunners?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better?
